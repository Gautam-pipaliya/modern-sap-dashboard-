services:
  # Public dashboard. Render supplies HTTPS and a public onrender.com URL.
  - type: web
    name: sap-developer-workbench
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: CHATBOT_HOSTPORT
        fromService:
          type: pserv
          name: sap-developer-chatbot
          property: hostport
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SAP_BASE_URL
        sync: false
      - key: SAP_CLIENT
        sync: false
      - key: SAP_USERNAME
        sync: false
      - key: SAP_PASSWORD
        sync: false
      - key: SAP_TLS_REJECT_UNAUTHORIZED
        value: "true"
      - key: SAP_CA_CERT
        value: /etc/secrets/sap-server.pem
      - key: SAP_TLS_SERVERNAME
        sync: false

  # Private service: only the dashboard calls this API over Render's network.
  - type: pserv
    name: sap-developer-chatbot
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.chatbot
    dockerContext: .
    disk:
      name: copilot-memory
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: COPILOT_HOST
        value: 0.0.0.0
      - key: COPILOT_PORT
        value: "8000"
      - key: COPILOT_MEMORY_DB
        value: /app/data/copilot_memory.sqlite3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
