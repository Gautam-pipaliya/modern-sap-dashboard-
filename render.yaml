services:
  # One free public web service runs both the dashboard and its private chatbot
  # in the same container. The chatbot listens on loopback only.
  - type: web
    name: sap-developer-workbench
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: CHATBOT_API_URL
        value: http://127.0.0.1:8000/api/chat
      - key: COPILOT_HOST
        value: 127.0.0.1
      - key: COPILOT_PORT
        value: "8000"
      - key: COPILOT_MEMORY_DB
        value: /tmp/copilot_memory.sqlite3
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SAP_BASE_URL
        sync: false
      - key: SAP_CLIENT
        sync: false
      - key: SAP_USERNAME
        sync: false
      - key: SAP_PASSWORD
        sync: false
      - key: SAP_TLS_REJECT_UNAUTHORIZED
        value: "true"
      - key: SAP_TLS_SERVERNAME
        sync: false
      - key: SAP_CA_CERT
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: AI_TRUST_ENV
        value: "true"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "12000"
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "1"
